<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#21578a"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#4a90d9" stroke-width="3"/>
  
  <!-- Shield shape -->
  <path d="M100 30 L150 50 L150 110 C150 145 100 170 100 170 C100 170 50 145 50 110 L50 50 Z" 
        fill="url(#shieldGrad)" stroke="#6ab0ff" stroke-width="2"/>
  
  <!-- Git branch icon inside shield -->
  <g transform="translate(100, 100)">
    <!-- Main line -->
    <line x1="-25" y1="-30" x2="-25" y2="30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- Branch circle top -->
    <circle cx="25" cy="-15" r="12" fill="none" stroke="#fff" stroke-width="4"/>
    <!-- Main circle bottom -->
    <circle cx="-25" cy="30" r="12" fill="#fff"/>
  </g>
  
  <!-- Checkmark overlay -->
  <path d="M70 130 L90 150 L130 100" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>